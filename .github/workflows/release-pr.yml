name: release-pr

"on":
  push:
    branches: [main]
    paths: [".changeset/**"]
  workflow_dispatch:
    inputs:
      patch:
        description: Create a shared patch release when no changesets are pending
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'xandreeddev/efferent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Request a coordinated patch release
        if: github.event_name == 'workflow_dispatch' && inputs.patch == true
        run: bun run release:patch
      - name: Consume changesets and prepare the shared release
        id: version
        run: bun run release:version
      - name: Open or update the release PR
        if: steps.version.outputs.has_changes == 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: changeset-release/main
          base: main
          delete-branch: true
          author: Xand Reed <xandreed@proton.me>
          committer: Xand Reed <xandreed@proton.me>
          title: release ${{ steps.version.outputs.version }}
          commit-message: |
            release ${{ steps.version.outputs.version }}

            Synchronize the shared package and plugin versions, release notes,
            compatibility fixtures and generated documentation from changesets.
          body: |
            ## What

            - Release the framework packages together at `${{ steps.version.outputs.version }}`.
            - Consume the pending changesets and synchronize plugin metadata,
              the central changelog, compatibility fixtures and generated docs.
            - Merging this PR signs off on CI publication after its checks pass.

            ## Checks

            - The required `ci` workflow validates this release before merging.
      # Explicit dispatch validates the branch; GitHub can still require approval
      # of a separate PR workflow before merging.
      - name: Run the required CI on the release branch
        if: steps.pr.outputs.pull-request-number != '' && (steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref changeset-release/main
