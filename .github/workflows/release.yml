name: release

"on":
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Shared release version, for example 0.16.0"
        required: true
        type: string
      commit:
        description: "Optional full source SHA; omit to resolve its release commit"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  target:
    if: >-
      github.repository == 'xandreeddev/efferent' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      eligible: ${{ steps.target.outputs.eligible }}
      version: ${{ steps.target.outputs.version }}
      sha: ${{ steps.target.outputs.sha }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: pipeline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: pipeline
      - name: Verify the exact release source and its successful CI
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bun pipeline/scripts/release-target.ts
          --root pipeline
          --event "$GITHUB_EVENT_PATH"
          --event-name "$GITHUB_EVENT_NAME"
          --repo "$GITHUB_REPOSITORY"

  publish:
    needs: target
    if: needs.target.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - name: Check out the tested publishing pipeline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: pipeline
          persist-credentials: false
      - name: Check out the verified release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.target.outputs.sha }}
          path: source
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0
      - name: Install the npm CLI with trusted-publishing support
        run: npm install --global npm@11.15.0 --ignore-scripts
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: pipeline
      - name: Build, verify, publish, confirm and tag
        id: publish
        env:
          # Omit this secret after configuring npm trusted publishers for all
          # packages. OIDC uses this job's id-token permission without a token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun pipeline/scripts/release-publish.ts --ci --root "$GITHUB_WORKSPACE/source" --verify
      - name: Create the GitHub release from the central changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.target.outputs.version }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
          RELEASE_SHA: ${{ steps.publish.outputs.sha }}
          EXPECTED_TAG: ${{ needs.target.outputs.tag }}
          EXPECTED_SHA: ${{ needs.target.outputs.sha }}
        run: |
          test "$RELEASE_TAG" = "$EXPECTED_TAG"
          test "$RELEASE_SHA" = "$EXPECTED_SHA"
          bun pipeline/scripts/release-notes.ts source/CHANGELOG.md "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      # Tags pushed with GITHUB_TOKEN do not start other push workflows.
      # Explicit dispatch deploys only after every npm package is confirmed.
      - name: Deploy the documentation from the published tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
