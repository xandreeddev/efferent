# Gate every push to main and every PR: typecheck (tsc + the foundry gate
# suite — core purity, Effect idioms behind the ratchet baseline, dependency
# direction) + the foundry E2E demo + the test suite.
#
# This is the lock that makes the rules un-ignorable: enable branch
# protection on `main` requiring the `ci` check (Settings → Branches →
# Require status checks → ci; no admin bypass), and a violation can neither
# be merged nor pushed to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The independent evaluation CLI and its packed-consumer fixture run on Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - run: bun install --frozen-lockfile

      # tsc + the zero-baseline repo gate suite — foundry's own source included.
      - run: bun run typecheck

      # Foundry's own profile (its 6-layer boundaries) — the dogfood proper.
      - run: bun packages/foundry/src/main.ts check --config packages/foundry/foundry.config.ts

      # Foundry's key-free E2E: the forge loop over a scripted implementor.
      - run: bun run foundry demo

      # Eval suites are key-gated and skip cleanly in CI; unit tests run.
      - run: bun test

      # Verify the built API outside the monorepo, without TypeScript aliases.
      - run: bun run build:packages
      - run: bun run verify:packages
      - run: bun run docs:generate
      # The generated references (plugins, events) are committed as generated, new files included.
      - run: |
          git status --porcelain -- docs packages/website/src/content/docs
          test -z "$(git status --porcelain -- docs packages/website/src/content/docs)"
      - run: bun run --cwd packages/website check
