# Build the documentation site (packages/website/, hand-built Astro) and deploy
# it to GitHub Pages — the project page at https://xandreeddev.github.io/efferent/.
#
# One-time setup:
# 1. Enable Pages with source "GitHub Actions"
#      Settings → Pages → Build and deployment → Source: GitHub Actions
#      (or: gh api -X POST /repos/xandreeddev/efferent/pages -f build_type=workflow)
# 2. Let release tags deploy: the github-pages environment admits only the
#    refs its deployment policy lists (it starts with `main` alone), and a
#    tag it refuses fails the deploy job after the build.
#      Settings → Environments → github-pages → Deployment branches and tags → add tag rule v*
#      (or: gh api -X POST repos/xandreeddev/efferent/environments/github-pages/deployment-branch-policies -f name='v*' -f type=tag)
#
# packages/website is a Bun workspace member, so it installs from the root
# bun.lock — one `bun install` at the repo root resolves its deps.
#
# The site deploys when a release is tagged (v*, once step 2 above is done),
# or by hand, never on every push to main: the docs describe what npm has,
# and main runs ahead of it between releases. Pushing a release tag is
# therefore outward-facing and needs the same sign-off as the npm publish
# (CONTRIBUTING.md, "Publishing"). CI (ci.yml) still builds and link-checks
# the site on every push.
name: docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-flight one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      # The docs site is a workspace member — install the whole workspace from
      # the root lockfile, then build/check inside its package dir.
      - run: bun install --frozen-lockfile

      - run: bun run build
        working-directory: packages/website

      - name: Check every internal link resolves
        run: bun run linkcheck
        working-directory: packages/website

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
